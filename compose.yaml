services:
  app:
    image: personal-agent:local
    container_name: personal-agent-local
    build: .
    ports:
      - '127.0.0.1:4310:4310'
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 4310
      DATA_DIR: /data
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4310}
      AGENT_UNRESTRICTED: 'true'
    volumes:
      - agent-data:/data
    shm_size: 256mb
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  agent-data:
    name: personal-agent-data
